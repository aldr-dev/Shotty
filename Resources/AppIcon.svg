<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Shotty</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C4677"/>
      <stop offset="1" stop-color="#0C2445"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#040C20" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="sheen" cx="512" cy="100" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge" cx="512" cy="512" r="582" gradientUnits="userSpaceOnUse">
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.09"/>
    </radialGradient>
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#040C20" flood-opacity="0.35"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Объём: верхний блик, светлые края и тонкий белый кант -->
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#edge)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <g transform="translate(100 100)" fill="#FFFFFF" filter="url(#symbolShadow)">
    <!-- Видоискатель -->
    <g fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
      <path d="M140 300 V224 A84 84 0 0 1 224 140 H300"/>
      <path d="M524 140 H600 A84 84 0 0 1 684 224 V300"/>
      <path d="M684 524 V600 A84 84 0 0 1 600 684 H524"/>
      <path d="M300 684 H224 A84 84 0 0 1 140 600 V524"/>
    </g>

    <!-- Камера -->
    <rect x="336" y="268" width="152" height="76" rx="30"/>
    <path fill-rule="evenodd" d="M292 312 H532 A50 50 0 0 1 582 362 V504 A50 50 0 0 1 532 554 H292 A50 50 0 0 1 242 504 V362 A50 50 0 0 1 292 312 Z M412 346 A86 86 0 1 0 412 518 A86 86 0 1 0 412 346 Z"/>
    <circle cx="412" cy="432" r="54"/>
  </g>
</svg>
